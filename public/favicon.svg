<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1322"/>
      <stop offset="50%" stop-color="#0f2137"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric Islamic star pattern watermark -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <polygon points="256,60 395,199 395,395 199,395 60,256 199,117"/>
    <polygon points="256,452 117,313 117,117 313,117 452,256 313,395"/>
  </g>

  <!-- Crescent Moon -->
  <path d="M 290 120 A 130 130 0 1 0 390 310 A 108 108 0 1 1 290 120 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"/>

  <!-- Star -->
  <polygon points="340,165 348,185 370,188 353,203 358,225 340,213 322,225 327,203 310,188 332,185" 
           fill="url(#goldGrad)" 
           filter="url(#glow)"/>

  <!-- Elegant Mosque Dome & Minaret Silhouette -->
  <g fill="url(#emeraldGrad)">
    <!-- Central Dome -->
    <path d="M 190 390 C 190 320 220 270 256 240 C 292 270 322 320 322 390 Z"/>
    <rect x="254" y="222" width="4" height="20" fill="#fbbf24"/>
    <circle cx="256" cy="220" r="5" fill="#fbbf24"/>
    
    <!-- Base Platform -->
    <rect x="140" y="380" width="232" height="40" rx="8" fill="#10b981" opacity="0.9"/>
    
    <!-- Left Minaret -->
    <path d="M 160 380 L 160 270 L 170 270 L 170 380 Z"/>
    <polygon points="156,270 165,240 174,270"/>
    
    <!-- Right Minaret -->
    <path d="M 342 380 L 342 270 L 352 270 L 352 380 Z"/>
    <polygon points="338,270 347,240 356,270"/>

    <!-- Arch Door -->
    <path d="M 236 420 L 236 360 C 236 345 276 345 276 360 L 276 420 Z" fill="#090d16"/>
  </g>
</svg>
